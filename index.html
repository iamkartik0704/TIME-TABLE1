<style>
    :root {
        --bg: #050505;
        --card-bg: #111111;
        --accent: #d4af37;
        --text-main: #ffffff;
        --text-dim: #777777;
        --border: #222222;
        --sidebar-width: 280px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text-main);
        margin: 0; padding: 0;
        display: flex; flex-direction: column; min-height: 100vh;
        overflow-x: hidden;
    }
    .navbar {
        background: #000;
        border-bottom: 1px solid var(--border);
        padding: 0 20px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 2000;
    }
    .navbar .brand { color: var(--accent); font-weight: 800; letter-spacing: 1px; font-size: 0.95rem; }
    header {
        padding: 3rem 1rem 2rem;
        text-align: center;
        border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    h2 { margin: 10px 0 0; font-size: 0.85rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 3px; }
    .main-content { flex: 1; padding: 20px; }
    .search-wrapper {
        max-width: 650px;
        margin: 0 auto 40px;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .input-container {
        background: var(--card-bg);
        padding: 5px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        border: 1px solid var(--border);
        transition: all 0.3s ease;
    }
    .input-container:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
    }
    input, select {
        flex: 1;
        background: transparent;
        border: none;
        padding: 16px 20px;
        color: white;
        font-size: 1.1rem;
        outline: none;
        font-family: inherit;
    }
    .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.75rem;
        cursor: pointer;
        border: none;
        display: none;
        transition: 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
        flex: 1;
        min-width: 140px;
        max-width: 200px;
    }
    .btn-save { background: var(--accent); color: black; }
    .btn-return { background: #222; color: var(--accent); border: 1px solid var(--accent); }
    .btn-erase { background: #441111; color: #ff9999; }
    #suggestions {
        position: absolute;
        top: 65px;
        left: 0; right: 0;
        background: #0f0f0f;
        border-radius: 12px;
        overflow: hidden;
        z-index: 1000;
        display: none;
        box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        border: 1px solid var(--border);
    }
    .suggestion-item { padding: 18px 25px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .suggestion-item:hover { background: #1a1a1a; color: var(--accent); }
    .schedule-grid { max-width: 900px; margin: 0 auto; display: grid; gap: 25px; padding-bottom: 80px; }
    .day-card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
    .is-today { border: 2px solid var(--accent) !important; background: rgba(212, 175, 55, 0.05); }
    .day-header { padding: 20px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .day-header h3 { margin: 0; font-size: 1.1rem; color: var(--accent); text-transform: uppercase; }
    .status-badge { font-size: 0.7rem; padding: 6px 14px; border-radius: 5px; background: #1a1a1a; color: var(--text-dim); font-weight: 800; }
    .is-today .status-badge { background: var(--accent); color: #000; }
    .class-row { display: grid; grid-template-columns: 150px 1fr 130px; padding: 18px 30px; align-items: center; gap: 8px; }
    .class-row:not(:last-child) { border-bottom: 1px solid var(--border); }
    .time { font-weight: 600; color: #fff; font-size: 0.9rem; }
    .room-tag { color: var(--accent); font-size: 0.8rem; text-align: right; font-weight: 600; }
    .course-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .config-card p { margin: 0 0 14px; color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; }
    /* Custom Select Dropdowns */
    .custom-select { position: relative; width: 100%; user-select: none; }
    .custom-select-btn { 
        width: 100%; background: #1a1a1a; border: 1px solid var(--border); border-radius: 10px;
        padding: 14px 40px 14px 16px; color: #fff; font-size: 0.95rem; text-align: left;
        cursor: pointer; position: relative; transition: all 0.3s ease;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .custom-select-btn::after {
        content: ''; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
        width: 16px; height: 16px;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
        background-repeat: no-repeat; background-position: center; background-size: contain;
        transition: transform 0.3s ease;
    }
    .custom-select.open .custom-select-btn::after { transform: translateY(-50%) rotate(180deg); }
    .custom-select-options {
        position: absolute; top: calc(100% + 8px); left: 0; right: 0;
        background: #111; border: 1px solid var(--accent); border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.9); z-index: 3000;

    .custom-select.open .custom-select-options { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .custom-select.open .custom-select-btn { border-color: var(--accent); box-shadow: 0 0 15px rgba(212, 175, 55, 0.05); }
    .custom-option {
        padding: 14px 16px; color: var(--text-dim); cursor: pointer; transition: 0.2s;
        border-bottom: 1px solid #1a1a1a;
        white-space: normal; line-height: 1.5; font-size: 0.9rem;
    }
    .custom-option:last-child { border-bottom: none; }
    .custom-option:hover, .custom-option.selected { background: #1a1a1a; color: #fff; }
    .custom-option.selected { color: var(--accent); font-weight: 600; }
    footer { padding: 40px; text-align: center; color: var(--accent); border-top: 1px solid var(--border); margin-top: auto; }
    .profile-header { text-align: center; margin-bottom: 30px; }
    .profile-header h3 { color: white; font-size: 1.5rem; margin: 0; }
    .profile-header p { color: var(--accent); font-size: 0.9rem; margin-top: 6px; }
    @media (max-width: 600px) {
        .class-row { grid-template-columns: 1fr; text-align: left; gap: 4px; }
        .room-tag { text-align: left; }
    }
    .sidebar-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); z-index: 2000; display: none;
    }
    .sidebar {
        position: fixed; top: 0; right: -300px; width: 300px; height: 100%;
        background: #000; z-index: 2001; transition: 0.3s ease;
        border-left: 1px solid var(--border); padding: 30px 20px;
        box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        color: var(--text-main);
    }
    .sidebar.active { right: 0; }
    .sidebar-overlay.active { display: block; }
    .sidebar-header {
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px;
    }
    .sidebar-header h3 { margin: 0; color: var(--accent); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
    .close-btn { background: none; border: none; color: var(--text-dim); font-size: 1.8rem; cursor: pointer; padding: 0; transition: color 0.2s; }
    .close-btn:hover { color: var(--text-main); }
    .menu-btn { background: none; border: none; color: var(--accent); font-size: 1.5rem; cursor: pointer; padding: 0 10px; transition: transform 0.2s; }
    .menu-btn:hover { transform: scale(1.1); }
</style>

// ---- EC2101/EE2101 shared practical, split into rotating batches G1/G2/G3.
// Only relevant to EE-family branches (EE, PC, VL, EC, CM). No student->batch
// mapping exists in the source timetable, so this is a temporary self-select. ----
const labGroupOptions = {
    G1: [{day:'Wednesday', time:'4 PM - 6 PM', room:'LT102'}, {day:'Friday', time:'4 PM - 6 PM', room:'LT102'}],
    G2: [{day:'Wednesday', time:'4 PM - 6 PM', room:'LT102'}, {day:'Thursday', time:'4 PM - 6 PM', room:'LT102'}],
    G3: [{day:'Thursday', time:'4 PM - 6 PM', room:'LT102'}, {day:'Friday', time:'4 PM - 6 PM', room:'LT102'}]
};
const eeFamilyBranches = ['EE','PC','VL','EC','CM'];

function getBranch(roll) { 
    const b = roll.substring(4, 6);
    return b === 'MC' ? 'MnC' : b;
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('sidebarOverlay').classList.toggle('active');
}

function handleTyping(val) {
    const suggBox = document.getElementById('suggestions');
    if (val.length < 2) { suggBox.style.display = 'none'; return; }
    const filtered = students.filter(s => s.name.toLowerCase().includes(val.toLowerCase())).slice(0, 6);
    if (filtered.length > 0) {
        suggBox.innerHTML = filtered.map(s => `
            <div class="suggestion-item" onclick="selectStudent('${s.name.replace(/'/g,"\\'")}', '${s.roll}')">
                ${s.name} <small style="display:block;color:#777">Roll: ${s.roll} &middot; Branch: ${getBranch(s.roll)}</small>
            </div>`).join('');
        suggBox.style.display = 'block';
    } else { suggBox.style.display = 'none'; }
}

function selectStudent(name, roll) { renderSchedule(name, roll); }

function saveAsMe() {
    if (currentViewing) {
        localStorage.setItem('myProfile', JSON.stringify(currentViewing));
        renderSchedule(currentViewing.name, currentViewing.roll);
    }
}

function eraseMe() {
    if (confirm("Reset and erase your profile?")) {
        localStorage.removeItem('myProfile');
        location.reload();
    }
}

function loadSavedProfile() {
    const saved = localStorage.getItem('myProfile');
    if (saved) {
        const data = JSON.parse(saved);
        renderSchedule(data.name, data.roll);
    }
}

function parseTime(timeStr, isEnd = false) {
    const parts = timeStr.split('-');
    const str = (isEnd && parts.length > 1) ? parts[1].trim().toLowerCase() : parts[0].trim().toLowerCase();
    
    let match = str.match(/(\d+)(?:[:.](\d+))?/);
    let hours = match ? parseInt(match[1]) : 0;
    let minutes = match && match[2] ? parseInt(match[2]) : 0;
    
    if (str.includes('pm') || str.includes('noon')) {
        if (hours !== 12) hours += 12;
    } else if (str.includes('am')) {
        if (hours === 12) hours = 0;
    } else {
        if (hours >= 1 && hours <= 7) {
            hours += 12;
        }
    }
    return hours * 60 + minutes;
}

function calculateTotalHours(classes) {
    let totalMinutes = 0;
    classes.forEach(c => {
        let start = parseTime(c.time, false);
        let end = parseTime(c.time, true);
        if (end > start) {
            totalMinutes += (end - start);
        }
    });
    
    if (totalMinutes === 0) return '';
    let hrs = Math.floor(totalMinutes / 60);
    let mins = totalMinutes % 60;
    
    let parts = [];
    if (hrs > 0) parts.push(`${hrs}h`);
    if (mins > 0) parts.push(`${mins}m`);
    return parts.join(' ');
}

function renderConfig(roll, branch, track) {
    const configArea = document.getElementById('configArea');
    const sidebarConfigArea = document.getElementById('sidebarConfigArea');
    let mainHtml = '';
    let sidebarHtml = '';

    if (branch !== 'ES') {
        const savedElective = localStorage.getItem('elective_' + roll) || '';
        const savedName = savedElective ? electiveOptions[savedElective].name : '— Select your elective —';
        
        const selectHtml = `
            <div class="custom-select" onclick="this.classList.toggle('open')">
                <div class="custom-select-btn">${savedElective ? savedElective + ' - ' + savedName : savedName}</div>
                <div class="custom-select-options">
                    <div class="custom-option ${savedElective===''?'selected':''}" onclick="setElective('${roll}', '')">— Select your elective —</div>
                    ${Object.keys(electiveOptions).map(code => `
                        <div class="custom-option ${savedElective===code?'selected':''}" onclick="setElective('${roll}', '${code}')">
                            ${code} - ${electiveOptions[code].name}
                        </div>
                    `).join('')}
                </div>
            </div>`;
            
        sidebarHtml += `
        <div style="margin-bottom: 20px;">
            <h4 style="color: var(--accent); margin: 0 0 8px; font-size: 0.85rem; text-transform: uppercase;">HSS Elective</h4>
            ${selectHtml}
        </div>`;

        if (!savedElective) {
            mainHtml += `
            <div class="config-card">
                <h4>HSS Elective (HS21XX slot)</h4>
                <p>This semester's HSS elective slot isn't tied to specific students in the source timetable, so pick the one you're actually enrolled in — it'll be remembered on this device.</p>
                ${selectHtml}
            </div>`;
        }
    }

    if (eeFamilyBranches.includes(branch)) {
        const savedGroup = localStorage.getItem('labgroup_' + roll) || '';
        
        const labSelectHtml = `
            <div class="custom-select" onclick="this.classList.toggle('open')">
                <div class="custom-select-btn">${savedGroup || '— Select your batch —'}</div>
                <div class="custom-select-options">
                    <div class="custom-option ${savedGroup===''?'selected':''}" onclick="setLabGroup('${roll}', '')">— Select your batch —</div>
                    ${Object.keys(labGroupOptions).map(g => `
                        <div class="custom-option ${savedGroup===g?'selected':''}" onclick="setLabGroup('${roll}', '${g}')">${g}</div>
                    `).join('')}
                </div>
            </div>`;
            
        sidebarHtml += `
        <div style="margin-bottom: 20px;">
            <h4 style="color: var(--accent); margin: 0 0 8px; font-size: 0.85rem; text-transform: uppercase;">Practical Batch</h4>
            ${labSelectHtml}
        </div>`;

        if (!savedGroup) {
            mainHtml += `
            <div class="config-card">
                <h4>EC2101/EE2101 Practical Batch</h4>
                <p>This practical runs as rotating batches (G1/G2/G3) with no student-batch list in the source timetable. Pick your batch to see the right lab days.</p>
                ${labSelectHtml}
            </div>`;
        }
    }

    configArea.innerHTML = mainHtml;
    if (sidebarHtml) {
        sidebarConfigArea.innerHTML = sidebarHtml;
    } else {
        sidebarConfigArea.innerHTML = `<p style="color: var(--text-dim); font-size: 0.9rem;">No settings available for this branch.</p>`;
    }
}

function setElective(roll, code) {
    if (code) localStorage.setItem('elective_' + roll, code);
    else localStorage.removeItem('elective_' + roll);
    if (currentViewing) renderSchedule(currentViewing.name, currentViewing.roll);
}

function setLabGroup(roll, group) {
    if (group) localStorage.setItem('labgroup_' + roll, group);
    else localStorage.removeItem('labgroup_' + roll);
    if (currentViewing) renderSchedule(currentViewing.name, currentViewing.roll);
}

let currentViewing = null;

function renderSchedule(name, roll) {
    currentViewing = { name, roll };
    document.getElementById('nameSearch').value = name;
    document.getElementById('suggestions').style.display = 'none';

    const savedData = localStorage.getItem('myProfile');
    const saved = savedData ? JSON.parse(savedData) : null;

    document.getElementById('saveAsMeBtn').style.display = (!saved || saved.roll !== roll) ? 'block' : 'none';
    document.getElementById('returnBtn').style.display = (saved && saved.roll !== roll) ? 'block' : 'none';
    document.getElementById('eraseBtn').style.display = (saved && saved.roll === roll) ? 'block' : 'none';

    const branch = getBranch(roll);
    const track = branchTrack[branch];

    renderConfig(roll, branch, track);

    // Build full list of sessions for this student
    let allSessions = [];
    if (track && trackCourses[track]) {
        for (const code in trackCourses[track]) {
            const courseName = courseNames[code] || code;
            trackCourses[track][code].forEach(sess => {
                allSessions.push({ code, name: courseName, day: sess.day, time: sess.time, room: sess.room, type: sess.type });
            });
        }
    }
    const elective = localStorage.getItem('elective_' + roll);
    if (elective && electiveOptions[elective]) {
        const fullElectiveName = electiveOptions[elective].name;
        const cleanName = fullElectiveName.includes('-') ? fullElectiveName.split('-').slice(1).join('-').trim() : fullElectiveName;
        electiveOptions[elective].sessions.forEach(sess => {
            allSessions.push({ code: elective, name: cleanName, day: sess.day, time: sess.time, room: sess.room, type: 'Elective' });
        });
    }
    const labGroup = localStorage.getItem('labgroup_' + roll);
    if (labGroup && eeFamilyBranches.includes(branch) && labGroupOptions[labGroup]) {
        labGroupOptions[labGroup].forEach(sess => {
            allSessions.push({ code: 'EC2101/EE2101', name: `Practical (Batch ${labGroup})`, day: sess.day, time: sess.time, room: sess.room, type: 'Lab' });
        });
    }

    const output = document.getElementById('output');
    const weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const today = new Intl.DateTimeFormat('en-US', {weekday: 'long'}).format(new Date());

    let html = `<div class="profile-header">
                    <h3>${name}</h3>
                    <p>Roll: ${roll} &middot; Branch: ${branch}${track ? '' : ' (no timetable data mapped yet)'}</p>
                </div>`;

    weekdays.forEach(day => {
        const isToday = (day === today);
        let classes = allSessions.filter(c => c.day === day);
        classes.sort((a, b) => parseTime(a.time) - parseTime(b.time));
        
        let totalHours = calculateTotalHours(classes);
        let totalHoursBadge = totalHours ? `<span style="font-size: 0.75rem; font-weight: 600; color: var(--text-dim); margin-left: 10px; text-transform: none;">Total: ${totalHours}</span>` : '';

        html += `
            <div class="day-card ${isToday ? 'is-today' : ''}">
                <div class="day-header">
                    <h3 style="display:flex; align-items:center;">${day} ${totalHoursBadge}</h3>
                    <span class="status-badge">${isToday ? 'TODAY' : 'WEEKDAY'}</span>
                </div>
                <div>
                    ${classes.length > 0 ? classes.map(c => {
                        const nameDisplay = c.name && c.name !== c.code ? ` — ${c.name}` : '';
                        return `
                        <div class="class-row">
                            <span class="time">${c.time}</span>
                            <span class="course-name">${c.code}${nameDisplay}<span class="type-badge type-${c.type}">${c.type}</span></span>
                            <span class="room-tag">📍 ${c.room}</span>
                        </div>`;
                    }).join('') : '<div style="padding:40px; color:#555; text-align:center;">No classes today.</div>'}
                </div>
            </div>`;
    });
    output.innerHTML = html;
}

window.onload = loadSavedProfile;
</script>
</body>
</html>
